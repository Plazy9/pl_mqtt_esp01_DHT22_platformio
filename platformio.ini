[env:esp01]
platform = espressif8266
board = esp01
framework = arduino
lib_deps = 
	adafruit/DHT sensor library@^1.4.6
	marvinroger/AsyncMqttClient@^0.9.0
	ottowinter/ESPAsyncTCP-esphome @ ^1.2.3
	bblanchon/ArduinoJson@^7.4.2
